name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          args: "check src scripts tests"
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          args: "format --check src scripts tests"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.1.0
      - name: Test
        run: uv run pytest
