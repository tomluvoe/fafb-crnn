[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fafb-crnn"
version = "0.1.0"
requires-python = ">=3.11"

dependencies = [
	"numpy>=2.4.6",
	"pandas",
	"pyarrow>=25.0.1",
	"torch>=2.14.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.ruff]
target-version = "py311"
src = ["src", "scripts", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
