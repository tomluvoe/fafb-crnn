[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fafb-crnn"
version = "0.1.0"
requires-python = ">=3.11"

dependencies = [
	"pandas",
]

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "ruff>=0.16.8",
]

[tool.ruff]
target-version = "py311"
src = ["src", "scripts"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
